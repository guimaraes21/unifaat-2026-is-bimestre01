name: Anti-Ruído Android

on:
  push:
    paths:
      - 'anti-ruido-android/**'
      - '.github/workflows/anti-ruido-android.yml'
  pull_request:
    paths:
      - 'anti-ruido-android/**'
      - '.github/workflows/anti-ruido-android.yml'
  workflow_dispatch:

jobs:
  dsp:
    name: Simulação do DSP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar e rodar o simulador da cabine
        run: |
          cmake -S anti-ruido-android/dsp-test -B build-dsp -DCMAKE_BUILD_TYPE=Release
          cmake --build build-dsp -j
          ./build-dsp/anc_sim

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: dsp
    defaults:
      run:
        working-directory: anti-ruido-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: anti-ruido-apk
          path: |
            anti-ruido-android/app/build/outputs/apk/release/*.apk
            anti-ruido-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
